function drawFolders(){const f=demo.folders.find(x=>x.id===state.folder)||demo.folders[0];let html=title('Dossiers','Classer, retrouver et partager les documents de l’association en respectant les droits d’accès.','Invitations › Dossiers',button('Importer un document','upload')+button('Nouveau dossier','new-folder','btn-primary'));html+=`<div class="stats">${stat('Dossiers documentaires','35','Arborescence du CRM','folder')}${stat('Documents classés','186','PDF, Word et autres','file','cyan')}${stat('Accès restreints','12','Vérifier les permissions','lock','orange')}${stat('Modifiés récemment','8','7 derniers jours','clock','purple')}</div>`+proposal('Une vraie bibliothèque documentaire : arborescence, recherche, fichiers, restrictions d’accès et raccourcis. Pas de faux indicateurs de projets.')+`<div class="grid split"><aside class="panel"><div class="panel-head"><div><h2>Arborescence</h2><p>Choisis un dossier.</p></div></div><div class="folder-tree">${demo.folders.map(x=>`<button class="folder ${x.id===state.folder?'active':''}" data-folder="${x.id}">${ic('folder')}<span>${safe(x.name)}</span>${x.private?ic('lock',12):''}<span class="folder-count">${x.count}</span></button>`).join('')}</div><div class="divider"></div><div class="panel-body"><div class="folder-info">${ic('lock',14)} <b>Droits d’accès</b><br>Les documents restreints doivent conserver les autorisations du CRM existant.</div></div></aside><section class="panel"><div class="folder-top"><div><div class="crumbs">Dossiers <span>›</span> <strong>${safe(f.name)}</strong></div><h2 style="margin-top:8px">${safe(f.name)}</h2><div class="small">${f.private?'Dossier à accès restreint':'Accessible selon les permissions normales du CRM'} · Démonstration</div></div><button class="btn" data-action="folder-access">${ic('shield',14)} Gérer les accès</button></div><div class="table-toolbar"><input class="field search" data-filter-search placeholder="Chercher un document…" aria-label="Chercher un document"><select class function kpiDefinitions(){return {
 members:[['Membres au registre','Tous les profils du répertoire'],['Adhésions actives','Membres dont le statut est actif'],['Renouvellements à faire','Membres en attente de renouvellement'],['Fiches à vérifier','Profils comportant une vérification à faire']],

 events:[['Événements à venir','Événements inscrits au calendrier'],['Inscriptions confirmées','Participation et inscriptions par événement'],['Places encore disponibles','Événements possédant des places libres'],['Clôtures à surveiller','Échéances à contrôler']],

 }[state.module]}
function kpiItems(){const i=state.kpi;
 if(state.module==='members')return demo.members.filter(x=>i===0||(i===1&&x.status==='Actif')||(i===2&&x.status==='À renouveler')||(i===3&&x.status==='À vérifier')).map(x=>({id:'member:'+x.id,title:x.name,subtitle:x.sec+' · '+x.email,kind:'Membre',status:x.status,date:x.renew}));
 if(state.module==='folders'){
  if(i===0||i===2){const f=demo.folders.filter(x=>i===0||x.private).map(x=>({id:'folder:'+x.id,title:x.name,subtitle:x.count+' documents (exemple)',kind:'Dossier',status:x.private?'Restreint':'Public interne',date:'—'}));if(i===0)return f;
   return f.concat(demo.files.filter(x=>x.access==='Restreint').map(x=>({id:'file:'+x.id,title:x.name,subtitle:demo.folders.find(f=>f.id===x.folder)?.name||'',kind:x.type,status:x.access,date:x.modified})))
  }
  return demo.files.filter(x=>i===1||['29 oct. 2026','25 oct. 2026','24 oct. 2026','23 oct. 2026'].includes(x.modified)).map(x=>({id:'file:'+x.id,title:x.name,subtitle:demo.folders.find(f=>f.id===x.folder)?.name||'',kind:x.type,status:x.access,date:x.modified}))
 }
 if(state.module==='events')return demo.events.filter(x=>i===0||i===1||(i===2&&x.registered<x.capacity)||(i===3&&['e1','e2'].includes(x.id))).map(x=>({id:'event:'+x.id,title:x.title,subtitle:x.place+' · '+x.registered+' / '+x.capacity+' inscriptions',kind:'Événement',status:x.status,date:i===3?'Clôture : '+x.deadline:x.date}));
 return demo.contacts.filter(x=>i===0||i===1||(i===2&&['À relancer','À vérifier'].includes(x.status))||(i===3&&['c3','c1','c5'].includes(x.id))).map(x=>({id:'contact:'+x.id,title:x.org,subtitle:x.person+' · '+x.email,kind:x.type,status:x.status,date:x.last}))
}
function drawKpiList(){const def=kpiDefinitions()[state.kpi];const items=kpiItems();return `<div class="kpi-list-top"><div><div class="eyebrow">AQDER › ${safe(moduleLabels[state.module])} › <b>Liste associée</b></div><h1>${safe(def[0])}</h1><p>${safe(def[1])}</p></div><div class="kpi-actions"><button type="button" class="btn" data-action="share-view">${ic('share',15)} Copier le lien de cette liste</button><button type="button" class="btn btn-primary" data-action="back-overview">${ic('arrow-left',15)} Vue d’ensemble</button></div></div><div class="kpi-summary"><strong>${items.length} éléments fictifs affichés.</strong> Ces exemples servent à valider la navigation et les filtres; les chiffres des indicateurs sont illustratifs et ne correspondent pas à la taille de cette liste.</div><section class="panel kpi-list-body">${panelHead('Liste à consulter','Recherche interactive. Clique sur une ligne pour ouvrir sa fiche de démonstration.')}<div class="table-toolbar"><input class="field search" data-filter-search aria-label="Rechercher dans la liste" placeholder="Rechercher dans cette liste…"><span class="small" id="resultCount">${items.length} exemples · données fictives</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Nom</th><th>Contexte</th><th>Catégorie</th><th>État</th><th>Date / échéance</th><th></th></tr></thead><tbody>${items.map(x=>`<tr data-row data-search="${safe([x.title,x.subtitle,x.kind,x.status].join(' '))}" data-status="all" data-item="${safe(x.id)}" tabindex="0"><td><span class="table-primary">${safe(x.title)}</span></td><td>${safe(x.subtitle)}</td><td>${safe(x.kind)}</td><td>${status(x.status)}</td><td>${safe(x.date)}</td><td><span class="ghost-link">Consulter ›</span></td></tr>`).join('')}</tbody></table></div><div class="caption">Prototype non connecté à l’AQDER · Aucune donnée réelle affichée</div></section>`}

function render(){renderNav();renderModuleSwitcher();statIndex=0;let labels={members:drawMembers,folders:drawFolders,events:drawEvents,contacts:drawContacts};const html=state.kpi===null?labels[state.module]():drawKpiList();document.getElementById('content').innerHTML=html;document.getElementById('shade').classList.remove('show');document.getElementById('sidebar').classList.remove('show');const u=new URL(location.href);u.searchParams.set('module',state.module);if(state.kpi===null)u.searchParams.delete('liste');else u.searchParams.set('liste',String(state.kpi+1));history.replaceState(null,'',u.pathname+u.search+u.hash);}
function closeDrawer(){document.getElementById('overlay').innerHTML=''}
function drawer(heading,description,body,footer=''){document.getElementById('overlay').innerHTML=`<div class="drawer-backdrop" data-action="close-outer"><aside class="drawer" role="dialog" aria-modal="true" aria-label="${safe(heading)}"><div class="drawer-hd"><div><h2>${heading}</h2><p>${description}</p></div><button class="drawer-x" data-action="close" aria-label="Fermer">×</button></div><div class="drawer-body">${body}</div>${footer?`<div class="drawer-actions">${footer}</div>`:''}</aside></div>`}
function detail(type,id){if(type==='folder'){state.folder=id;state.kpi=null;render();return;}const ds={member:'members',file:'files',event:'events',contact:'contacts'};const item=demo[ds[type]]?.find(x=>x.id===id);if(!item)return;let body='',h='',desc='';if(type==='member'){h=item.name;desc='Fiche membre · Accès contrôlé selon les permissions';body=`<div class="detail-card"><div class="key">Section</div><div class="val">${safe(item.sec)}</div><div class="key">Statut</div><div class="val">${status(item.status)}</div><div class="key">Renouvellement</div><div class="val">${item.renew}</div><div class="key">Courriel</div><div class="val">${safe(item.email)}</div></div><div class="note">${ic('users')}<div>Depuis la fiche réelle, l’AQDER pourrait accéder aux mandats, distinctions, notes et personnes associées.</div></div>`}else if(type==='file'){h=item.name;desc='Aperçu documentaire · Aucun fichier réel ouvert';body=`<div class="detail-card"><div class="key">Type</div><div class="val">${item.type}</div><div class="key">Taille</div><div class="val">${item.size}</div><div class="key">Accès</div><div class="val">${status(item.access)}</div><div class="key">Dernière modification</div><div class="val">${item.modified}</div></div><div class="note">${ic('shield')}<div>Sur la vraie version, le téléchargement et le partage respecteraient les droits du dossier.</div></div>`}else if(type==='event'){h=item.title;desc=`Événement · ${item.date} · ${item.place}`;body=`<div class="detail-card"><div class="key">Inscriptions</div><div class="val">${item.registered} / ${item.capacity}</div><div class="progress"><span style="width:${item.registered/item.capacity*100}%"></span></div><div class="key" style="margin-top:17px">Date limite des inscriptions</div><div class="val">${item.deadline}</div><div class="key">Section</div><div class="val">${item.section}</div></div><h3 style="font-size:14px">Activités et inscriptions</h3><div class="stack"><div class="preview-hint">${ic('users')} <span>Participants inscrits et billets par activité</span></div><div class="preview-hint">${ic('calendar')} <span>Délais d’annulation et places disponibles</span></div></div>`}else{h=item.org;desc='Contact organisationnel · Relation et notes';body=`<div class="detail-card"><div class="key">Personne principale</div><div class="val">${safe(item.person)}</div><div class="key">Courriel</div><div class="val">${safe(item.email)}</div><div class="key">Type et statut</div><div class="val">${safe(item.type)} · ${status(item.status)}</div><div class="key">Dernier suivi</div><div class="val">${item.last}</div></div><div class="form-row"><label>Nouvelle note de suivi (simulation)</label><textarea id="detailNote" placeholder="Ex. Relancer au début du mois prochain…"></textarea></div>`}
let foot=`<button class="btn" data-action="close">Fermer</button><button class="btn btn-primary" data-action="simulate-detail">${type==='event'?'Consulter les inscriptions':type==='file'?'Ouvrir le document':type==='member'?'Modifier la fiche':'Ajouter le suivi'}</button>`;drawer(h,desc,body,foot)}

function toast(s){document.getElementById('toastHost').innerHTML=`<div class="toast">✓ ${safe(s)}</div>`;clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>document.getElementById('toastHost').innerHTML='',3800)}
function guide(){drawer('Proposition UX — AQDER','Pourquoi ces prototypes sont conçus pour la réalité du CRM',`<div class="stack"><div class="detail-card"><b>1. Membres</b><p class="small">Réduire le temps passé à gérer statuts, sections, coordonnées, renouvellements et fiches.</p><b>2. Dossiers</b><p class="small">Faciliter la navigation documentaire, la recherche et les permissions d’accès.</p><b>3. Événements</b><p class="small">Voir capacités, inscriptions, activités et échéances en contexte.</p><b>4. Contacts</b><p class="small">Retrouver organismes, personnes-ressources, notes et suivis rapidement.</p></div><div class="note">${ic('alert')}<div><strong>Maquette fonctionnelle, pas un nouveau CRM.</strong> Les données sont toutes fictives; aucun graphique ou chiffre ne doit être présenté comme réel. Les changements n’ont pas été déployés sur AQDER.</div></div><div class="quote">Proposition commerciale : concevoir et intégrer quatre espaces de travail ergonomiques aux données et droits déjà en place, avec validation client, migration d’interface par module et recette de non-régression.</div></div>`,`<button class="btn btn-primary" data-action="close">Compris</button>`)}
function action(name){if(name==='back-overview'){state.kpi=null;state.tab='overview';render();return}if(name==='share-view'){const url=location.href;const copied=navigator.clipboard?.writeText?navigator.clipboard.writeText(url):Promise.reject(new Error('Clipboard unavailable'));copied.then(()=>toast('Lien de cette liste copié.')).catch(()=>{window.prompt('Copie le lien pour le partager :',url)});return}if(name==='toggle-menu'){document.getElementById('sidebar').classList.toggle('show');document.getElementById('shade').classList.toggle('show');return}if(name==='close'||name==='close-outer'){closeDrawer();return}if(name==='guide'){guide();return}if(['new-member','new-folder','new-event','new-contact'].includes(name)){openForm(name);return}if(name==='folder-access'){drawer('Accès au dossier','Permissions selon les rôles AQDER',`<div class="note">${ic('lock')}<div>Le gestionnaire sélectionne les rôles ou personnes autorisés. Cet écran est un parcours de démonstration; les permissions réelles restent inchangées.</div></div><div class="form-row" style="margin-top:18px"><label><input type="checkbox" checked style="width:auto"> Administrateurs</label></div><div class="form-row"><label><input type="checkbox" style="width:auto"> Responsables désignés</label></div>`,`<button class="btn" data-action="close">Fermer</button><button class="btn btn-primary" data-action="simulate-detail">Simuler l’enregistrement</button>`);return}if(name==='upload'){drawer('Importer un document','Import simulé — aucun fichier transféré',`<div class="form-row"><label>Choisir un fichier</label><input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx" id="fakeUpload"></div><div class="form-row"><label>Dossier de destination</label><select id="fakeDestination">${demo.folders.map(x=>`<option>${safe(x.name)}</option>`).join('')}</select></div>`,`<button class="btn" data-action="close">Annuler</button><button class="btn btn-primary" data-action="simulate-detail">Simuler l’import</button>`);return}if(name==='registrations'){drawer('Inscriptions aux événements','Vue de démonstration des inscriptions',`<div class="detail-card"><div class="key">Rencontre des présidences</div><div class="val">46 inscriptions · 60 places</div><div class="key">Formation — Gestion documentaire</div><div class="val">29 inscriptions · 35 places</div><div class="key">Assemblée de concertation</div><div class="val">81 inscriptions · 120 places</div></div><div class="note">${ic('users')}<div>Dans le CRM réel, l’écran serait relié aux personnes inscrites et aux billets des activités.</div></div>`,`<button class="btn" data-action="close">Fermer</button>`);return}if(name==='simulate-detail'){closeDrawer();toast('Action démontrée — aucune donnée réelle modifiée.');return}if(name.startsWith('members-')){state.tab=name==='members-check'?'tasks':'all';render();const sel=document.querySelector('[data-filter-select]');if(name==='members-renew'&&sel){sel.value='À renouveler';applyFilter()}else if(name==='members-check'&&sel){sel.value='À vérifier';applyFilter()}return}if(name==='export'){toast('Export simulé — aucune donnée réelle exportée.');return}toast('Fonction accessible lors de l’intégration au CRM.');}
function applyFilter(){const inp=document.querySelector('[data-filter-search]');const sel=document.querySelector('[data-filter-select]');let q=(inp?.value||'').toLowerCase(),s=sel?.value||'all',n=0;document.querySelectorAll('[data-row]').forEach(row=>{const ok=(row.dataset.search||'').toLowerCase().includes(q)&&(s==='all'||row.dataset.status===s);row.hidden=!ok;if(ok)n++});const count=document.getElementById('resultCount');if(count)count.textContent=`${n} résultat${n===1?'':'s'} · Démonstration, données fictives`}
function submit(form){const fd=new FormData(form),type=form.dataset.form;if(!form.reportValidity())return;if(type==='new-member'){let name=`${fd.get('firstname')} ${fd.get('lastname')}`,id='m'+Date.now();demo.members.unshift({id,name,sec:fd.get('sec'),status:'À vérifier',renew:'À confirmer',email:fd.get('email'),type:'Nouvelle fiche'})}if(type==='new-folder'){let id='f'+Date.now();demo.folders.unshift({id,name:fd.get('name'),count:0,private:fd.has('private')});state.folder=id}if(type==='new-event'){let d=String(fd.get('date')),id='e'+Date.now();demo.events.unshift({id,title:fd.get('name'),date:d,day:d.slice(-2),month:'nov.',place:fd.get('place')||'À définir',section:'Toutes les sections',registered:0,capacity:+fd.get('capacity')||50,deadline:'À fixer',status:'En préparation'})}if(type==='new-contact'){let id='c'+Date.now();demo.contacts.unshift({id,org:fd.get('org'),person:fd.get('person'),email:fd.get('email'),type:fd.get('type'),status:'À vérifier',last:'Aujourd’hui'})}closeDrawer();render();toast('Fiche ajoutée à la démonstration — aucune donnée CRM modifiée.');}
document.addEventListener('click',e=>{const target=e.target.closest('[data-nav],[data-tab],[data-folder],[data-item],[data-action]');if(!target){if(e.target.classList.contains('drawer-backdrop'))closeDrawer();return;}if(target.dataset.action==='close-outer'&&e.target!==target)return;if(target.dataset.kpi!==undefined){state.kpi=Number(target.dataset.kpi);render();window.scrollTo({top:0,behavior:'smooth'});return}if(target.dataset.nav){if(target.dataset.nav==='other'){toast(`${target.dataset.label} : hors du périmètre de la démonstration.`);return;}state.module=target.dataset.nav;state.tab='overview';state.kpi=null;render();return}if(target.dataset.tab){state.tab=target.dataset.tab;state.kpi=null;render();return}if(target.dataset.folder){state.module='folders';state.folder=target.dataset.folder;state.kpi=null;render();return}if(target.dataset.item){const [type,id]=target.dataset.item.split(':');detail(type,id);return}if(target.dataset.action)action(target.dataset.action)});document.addEventListener('input',e=>{if(e.target.matches('[data-filter-search]'))applyFilter()});document.addEventListener('change',e=>{if(e.target.matches('[data-filter-select]'))applyFilter()});document.addEventListener('submit',e=>{if(e.target.matches('#demoForm')){e.preventDefault();submit(e.target)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='Enter'&&e.target.matches('[data-item]')){e.preventDefault();e.target.click()}});document.getElementById('shade').addEventListener('click',()=>action('toggle-menu'));render();
</script></body></html>
